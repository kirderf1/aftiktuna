on: workflow_dispatch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Deploy WebAssembly build to Github Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build Wasm
        run: |
          wasm-pack build --target web --release --no-pack aftiktuna-rust/aftiktuna-three-d/
          cp aftiktuna-rust/aftiktuna-three-d/pkg/* aftiktuna-rust/aftiktuna-three-d/web/
      - name: Upload GitHub Pages artifacts
        id: deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: aftiktuna-rust/aftiktuna-three-d/web/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
